name: Auto-merge SEO PRs after 48h

# Every day at 13:00 UTC (9am ET), look for open PRs from the SEO bot
# that are >48 hours old and merge them. This lets you review PRs at your
# own pace but ensures they don't sit forever.
#
# To reject a PR: just close it (without merging). Closed PRs are ignored.
# To delay a PR: add the "hold" label.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and merge eligible SEO PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          NOW=$(date -u +%s)
          THRESHOLD=$((48 * 3600))

          gh pr list \
            --state open \
            --json number,headRefName,createdAt,labels,title \
            --limit 50 > /tmp/prs.json

          # Emit one tab-separated line per seo/* PR. PR titles contain
          # spaces, ampersands and quotes, so the raw JSON is never passed
          # through shell word splitting. The title is the last field and
          # any tabs or newlines inside it are flattened first.
          jq -r '
            .[]
            | select(.headRefName | startswith("seo/"))
            | [ (.number | tostring),
                .createdAt,
                (((.labels // []) | map(.name) | index("hold")) as $h
                  | if $h == null then "open" else "hold" end),
                (.title | gsub("[\t\n\r]"; " ")) ]
            | @tsv
          ' /tmp/prs.json > /tmp/eligible.tsv

          MERGED=0
          SKIPPED=0
          FAILED=0

          while IFS=$'\t' read -r NUM CREATED HOLD TITLE; do
            [ -n "${NUM:-}" ] || continue

            if [ "$HOLD" = "hold" ]; then
              echo "PR #$NUM: skipped (hold label)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            CREATED_SEC=$(date -u -d "$CREATED" +%s)
            AGE=$((NOW - CREATED_SEC))

            if [ "$AGE" -lt "$THRESHOLD" ]; then
              HOURS=$((AGE / 3600))
              echo "PR #$NUM: skipped (age ${HOURS}h, needs 48h), '$TITLE'"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "PR #$NUM: merging (age >= 48h), '$TITLE'"

            # A single unmergeable PR must not abort the whole run, which is
            # what happened previously under `set -e`.
            if gh pr merge "$NUM" --squash --delete-branch \
                 --subject "seo(auto): $TITLE (#$NUM)" \
                 --body "Auto-merged after 48h with no objection. See PR discussion for original review window."; then
              MERGED=$((MERGED + 1))
            else
              echo "PR #$NUM: merge failed (conflict, failing check, or protected branch). Left open."
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/eligible.tsv

          echo ""
          echo "Summary: merged=$MERGED skipped=$SKIPPED failed=$FAILED"

          # Surface merge failures without failing the run, so tomorrow's
          # run still executes.
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED SEO PR(s) could not be merged automatically and were left open."
          fi

      - name: Post daily audit trail issue comment (if merges happened)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Optional: add a comment to the most recent audit issue whenever
          # this workflow does something noteworthy. Non-fatal if it fails.
          true
